<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Sport+">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/favicon-48.png" sizes="48x48" type="image/png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <title>Sport+ | Planning</title>
  <link rel="stylesheet" href="css/planning.css">
  <link rel="stylesheet" href="css/mobile.css">
  <link rel="stylesheet" href="css/theme.css">
</head>
<body>

  <header class="header">
    <a class="logo" href="index.html" aria-label="Sport+ – accueil">Sport<span>+</span></a>
    <nav class="nav" id="nav" aria-label="Navigation principale">
      <a href="index.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/></svg><span>Accueil</span></a>
      <a href="seance.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg><span>Séance</span></a>
      <a href="planning.html" class="active" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Planning</span></a>
      <a href="historique.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 21h18"/><path d="M6 17v-5M12 17V7M18 17v-9"/></svg><span>Historique</span></a>
      <a href="boutique.html"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14l-1 13H6L5 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg><span>Boutique</span></a>
    </nav>
    <a class="solde-chip" href="boutique.html" aria-label="Pièces – ouvrir la boutique">
      <img class="solde-avatar" data-avatar-equipe src="assets/avatars/recrue-base.svg" alt="" width="34" height="34">
      <svg class="ico-piece" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="#b37f00"/><circle cx="12" cy="11" r="10" fill="#ffb800"/><circle cx="12" cy="11" r="7" fill="none" stroke="#b37f00" stroke-width="1.5"/><path d="M12 7.5v7M8.5 11h7" stroke="#b37f00" stroke-width="2.2" stroke-linecap="round"/></svg>
      <span id="solde-pieces">0</span>
    </a>
  </header>

  <section class="title-section">
    <h1>Mon Planning</h1>
    <p class="subtitle">Programme tes séances à l'avance</p>
  </section>

  <!-- Calendrier -->
  <section class="calendar-section">
    <div class="calendar-nav">
      <button class="cal-nav-btn" id="prev-month" aria-label="Mois précédent">&#8592;</button>
      <h2 class="cal-month-label" id="cal-month-label"></h2>
      <button class="cal-nav-btn" id="next-month" aria-label="Mois suivant">&#8594;</button>
    </div>
    <div class="calendar-grid" id="calendar-grid"></div>
  </section>

  <!-- Liste des séances programmées -->
  <section class="seances-programmees">
    <div class="section-header">
      <h2>📋 Séances programmées</h2>
    </div>
    <div id="liste-programmees"></div>
  </section>

  <!-- MODAL — Créer une séance -->
  <div class="modal-overlay hidden" id="modal-create">
    <div class="modal-card">
      <div class="modal-header">
        <h2>Programmer une séance</h2>
        <button class="modal-close" onclick="fermerModal()" aria-label="Fermer">✕</button>
      </div>

      <div class="modal-body">
        <!-- Date sélectionnée -->
        <div class="field-group">
          <label>Date</label>
          <div class="date-display" id="modal-date-display"></div>
        </div>

        <!-- Nom de la séance -->
        <div class="field-group">
          <label for="seance-nom">Nom de la séance</label>
          <input type="text" id="seance-nom" placeholder="Ex: Push day, Jambes, Full body…" maxlength="40">
        </div>

        <!-- Récurrence -->
        <div class="field-group">
          <label>Récurrence</label>
          <div class="recurrence-options">
            <button class="recurrence-btn active" data-value="once">Une seule fois</button>
            <button class="recurrence-btn" data-value="weekly">Chaque semaine</button>
          </div>
        </div>

        <!-- Sélection des exercices -->
        <div class="field-group">
          <label>Exercices <span class="exo-count-label" id="modal-exo-count">(0 sélectionné)</span></label>
          <div class="modal-filters">
            <div class="filter-scroll">
              <button class="modal-filter-btn active" data-muscle="all">Tous</button>
              <button class="modal-filter-btn" data-muscle="pectoraux">Pectoraux</button>
              <button class="modal-filter-btn" data-muscle="dos">Dos</button>
              <button class="modal-filter-btn" data-muscle="epaules">Épaules</button>
              <button class="modal-filter-btn" data-muscle="bras">Bras</button>
              <button class="modal-filter-btn" data-muscle="jambes">Jambes</button>
              <button class="modal-filter-btn" data-muscle="abdos">Abdos</button>
            </div>
          </div>
          <div class="modal-exo-grid" id="modal-exo-grid"></div>
        </div>
      </div>

      <div class="modal-footer">
        <button class="modal-btn secondary" onclick="fermerModal()">Annuler</button>
        <button class="modal-btn primary" onclick="sauvegarderSeanceProgrammee()">Programmer ✓</button>
      </div>
    </div>
  </div>

  <!-- MODAL — Éditer les exercices d'une séance programmée -->
  <div class="modal-overlay hidden" id="modal-edit-planning">
    <div class="modal-card">
      <div class="modal-header">
        <h2>✏️ Modifier les exercices</h2>
        <button class="modal-close" onclick="fermerModalEditPlanning()" aria-label="Fermer">✕</button>
      </div>
      <div class="modal-body">
        <div class="field-group">
          <label>Exercices <span class="exo-count-label" id="edit-exo-count">(0 sélectionné)</span></label>
          <div class="modal-filters">
            <div class="filter-scroll">
              <button class="edit-filter-btn active" data-muscle="all">Tous</button>
              <button class="edit-filter-btn" data-muscle="pectoraux">Pectoraux</button>
              <button class="edit-filter-btn" data-muscle="dos">Dos</button>
              <button class="edit-filter-btn" data-muscle="epaules">Épaules</button>
              <button class="edit-filter-btn" data-muscle="bras">Bras</button>
              <button class="edit-filter-btn" data-muscle="jambes">Jambes</button>
              <button class="edit-filter-btn" data-muscle="abdos">Abdos</button>
            </div>
          </div>
          <div class="modal-exo-grid" id="edit-exo-grid"></div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="modal-btn secondary" onclick="fermerModalEditPlanning()">Annuler</button>
        <button class="modal-btn primary" onclick="sauvegarderEditPlanning()">Sauvegarder ✓</button>
      </div>
    </div>
  </div>

  <script src="js/donnees-exercices.js"></script>
  <script src="js/donnees-avatars.js"></script>
  <script src="js/commun.js"></script>
  <script src="js/pieces.js"></script>
  <script src="js/planning.js"></script>
  <script src="js/notif-planning.js"></script>

</body>
</html>
