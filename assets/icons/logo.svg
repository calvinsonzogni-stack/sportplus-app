    <rect x="46.5" y="42.5" width="37.5" height="15" rx="1.6"/>
    <rect x="33" y="42.5" width="15.5" height="3.8" rx="1" opacity=".85"/>
    <rect x="22" y="48.1" width="26.5" height="3.8" rx="1"/>
    <rect x="29" y="53.7" width="19.5" height="3.8" rx="1" opacity=".7"/>
  </g>
